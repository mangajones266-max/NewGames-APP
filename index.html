<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NewGames - Baixar App</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Orbitron:wght@500;800&display=swap" rel="stylesheet">
    
    <style>
        /* CONFIGURAÇÕES GERAIS DO SITE - ALTERE AQUI PARA MUDAR TUDO */
        :root {
            /* Cores do Site */
            --cor-primaria: #8a2be2;     /* Roxo Principal (Botão) */
            --cor-secundaria: #a855f7;   /* Roxo Claro (Brilhos e Hover) */
            --cor-escura: #4c1d95;       /* Roxo Escuro (Fundo do Botão) */
            --texto-branco: #f3f4f6;     /* Cor do texto principal */
            --texto-cinza: #9ca3af;      /* Cor do texto secundário (Parágrafo) */
            
            /* Configurações da Imagem de Fundo */
            --fundo-imagem: url('https://i.postimg.cc/zXdxwXYj/Fundo-do-Site.jpg');
            --fundo-zoom: 1.1;           /* Aumente ou diminua o zoom da imagem aqui */
            --fundo-posicao: center center;

            /* Configurações do Botão de Download */
            --btn-tamanho-fonte: 24px;
            --btn-padding: 22px 60px;
            --btn-borda-raio: 50px;
        }

        /* Reset básico para tirar margens padrão */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Rajdhani', sans-serif;
        }

        body {
            color: var(--texto-branco);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden; 
            position: relative;
        }

        /* Configuração da Imagem de Fundo com Zoom */
        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2; 
            overflow: hidden;
        }

        .bg-image {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            background-image: var(--fundo-imagem);
            background-position: var(--fundo-posicao);
            background-size: cover;
            background-repeat: no-repeat;
            transform: translate(-50%, -50%) scale(var(--fundo-zoom));
            will-change: transform; 
        }

        /* Camada escura por cima do fundo para o texto ficar legível */
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(10, 10, 15, 0.8) 0%, rgba(10, 10, 15, 0.95) 100%);
            z-index: -1;
        }

        /* Botão do Discord no Canto Superior Direito */
        .discord-btn {
            position: fixed;
            top: 25px;
            right: 25px;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(20, 20, 30, 0.6);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(138, 43, 226, 0.3);
            border-radius: 50%;
            text-decoration: none;
            z-index: 1000;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 0.6; /* Efeito de fade inicial */
        }

        .discord-btn svg {
            width: 32px;
            height: 32px;
            fill: #ffffff;
            transition: all 0.4s ease;
        }

        /* Efeito ao passar o mouse no Discord */
        .discord-btn:hover {
            opacity: 1;
            border-color: var(--cor-secundaria);
            background: rgba(138, 43, 226, 0.2);
            transform: scale(1.1) translateY(-3px);
            box-shadow: 0 0 25px rgba(138, 43, 226, 0.6), 0 0 50px rgba(138, 43, 226, 0.3);
        }

        .discord-btn:hover svg {
            fill: var(--cor-secundaria);
            filter: drop-shadow(0 0 8px var(--cor-primaria));
        }

        /* Conteúdo Principal (Texto e Botão) */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
            position: relative;
            z-index: 1;
        }

        .hero-content {
            max-width: 800px;
            animation: fadeInUp 1s ease-out;
        }

        .hero-content h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 64px;
            line-height: 1.1;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .hero-content h1 span {
            color: var(--cor-secundaria);
            text-shadow: 0 0 20px var(--cor-primaria);
        }

        .hero-content p {
            font-size: 22px;
            color: var(--texto-cinza);
            margin-bottom: 50px;
            line-height: 1.6;
        }

        /* Botão de Download Roxo */
        .btn-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .btn-download {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: var(--btn-padding);
            font-family: 'Orbitron', sans-serif;
            font-size: var(--btn-tamanho-fonte);
            font-weight: 800;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(135deg, var(--cor-primaria), var(--cor-escura));
            border: none;
            border-radius: var(--btn-borda-raio);
            cursor: pointer;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.4), inset 0 0 10px rgba(255, 255, 255, 0.2);
            z-index: 1;
        }

        .btn-download:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 0 40px rgba(138, 43, 226, 0.8), 0 0 80px rgba(138, 43, 226, 0.4), inset 0 0 20px rgba(255, 255, 255, 0.4);
            background: linear-gradient(135deg, var(--cor-secundaria), var(--cor-primaria));
        }

        .btn-download:active {
            transform: translateY(-2px) scale(0.98);
            box-shadow: 0 0 15px rgba(138, 43, 226, 0.6);
        }

        /* Efeito de brilho passando dentro do botão */
        .btn-download::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: all 0.5s ease;
            z-index: -1;
        }

        .btn-download:hover::before {
            left: 100%;
        }

        /* Animação do botão pulsando (quando ninguém está mexendo) */
        @keyframes pulsar {
            0% { box-shadow: 0 0 20px rgba(138, 43, 226, 0.4); }
            50% { box-shadow: 0 0 40px rgba(138, 43, 226, 0.8); }
            100% { box-shadow: 0 0 20px rgba(138, 43, 226, 0.4); }
        }

        .btn-download.pulsando {
            animation: pulsar 2s infinite;
        }

        /* Estado do botão quando está baixando */
        .btn-download.baixando {
            background: linear-gradient(135deg, #333, #111);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
            cursor: wait;
            animation: none;
            pointer-events: none;
        }

        .spinner {
            display: none;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: girar 1s ease-in-out infinite;
            margin-right: 15px;
        }

        @keyframes girar {
            to { transform: rotate(360deg); }
        }

        /* Rodapé */
        footer {
            text-align: center;
            padding: 20px;
            color: var(--texto-cinza);
            font-size: 16px;
            border-top: 1px solid rgba(138, 43, 226, 0.1);
            position: relative;
            z-index: 1;
        }

        /* Animação de entrada do texto */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Ajustes para celular */
        @media (max-width: 768px) {
            .hero-content h1 { font-size: 40px; }
            .hero-content p { font-size: 18px; }
            .btn-download { padding: 18px 40px; font-size: 20px; }
            .discord-btn { top: 15px; right: 15px; width: 50px; height: 50px; }
            .discord-btn svg { width: 26px; height: 26px; }
        }
    </style>
</head>
<body>

    <!-- Ícone do Discord -->
    <a href="https://discord.gg/ZkWYVguznW" target="_blank" class="discord-btn" title="Entre no nosso Discord">
        <svg viewBox="0 0 127.14 96.36" xmlns="http://www.w3.org/2000/svg">
            <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,46,96.12,53,91.08,65.69,84.69,65.69Z"/>
        </svg>
    </a>

    <!-- Fundo do Site -->
    <div class="bg-container">
        <div class="bg-image"></div>
    </div>
    <div class="bg-overlay"></div>

    <!-- Conteúdo Principal -->
    <main>
        <div class="hero-content">
            <h1>Baixe o App <span>NewGames</span></h1>
            <p>A sua central definitiva de jogos. Acesse lançamentos, ofertas exclusivas e gerencie sua biblioteca diretamente do seu dispositivo.</p>
            
            <div class="btn-wrapper">
                <button id="btn-download" class="btn-download pulsando">
                    <div class="spinner" id="spinner"></div>
                    <span id="btn-texto">Baixar Agora</span>
                </button>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 NewGames. Todos os direitos reservados.</p>
    </footer>

    <!-- JAVASCRIPT - LÓGICA DO SITE -->
    <script>
        // Pega os elementos do HTML para o JavaScript controlar
        const botaoDownload = document.getElementById('btn-download');
        const textoBotao = document.getElementById('btn-texto');
        const spinner = document.getElementById('spinner');

        // Efeito: Para de pulsar quando o mouse passa em cima
        botaoDownload.addEventListener('mouseenter', () => {
            botaoDownload.classList.remove('pulsando');
        });

        // Efeito: Volta a pulsar quando o mouse sai
        botaoDownload.addEventListener('mouseleave', () => {
            if (!botaoDownload.classList.contains('baixando')) {
                botaoDownload.classList.add('pulsando');
            }
        });

        // Ação principal: O que acontece quando clica no botão
        botaoDownload.addEventListener('click', function(event) {
            event.preventDefault(); // Impede a página de recarregar

            // Muda o visual do botão para o estado "Baixando"
            botaoDownload.classList.add('baixando');
            botaoDownload.classList.remove('pulsando');
            spinner.style.display = 'block';
            textoBotao.innerText = 'Preparando...';

            // Espera 1.5 segundos e muda para "Baixando..."
            setTimeout(() => {
                textoBotao.innerText = 'Baixando...';
                
                // Espera mais 1.5 segundos e inicia o download real
                setTimeout(() => {
                    spinner.style.display = 'none';
                    textoBotao.innerText = 'Download Concluído!';
                    
                    // COMANDO QUE FAZ O DOWNLOAD DO SEU APP ACONTECER
                    window.location.href = "https://github.com/mangajones266-max/NewGames-APP/releases/download/v1.0/New.Games.-.INSTALADOR.exe";
                    
                    // Restaura o botão ao estado normal depois de 3 segundos
                    setTimeout(() => {
                        botaoDownload.classList.remove('baixando');
                        textoBotao.innerText = 'Baixar Agora';
                        botaoDownload.classList.add('pulsando');
                    }, 3000);

                }, 1500);
            }, 1500);
        });

        // Efeito visual: Onda branca quando clica no botão (Ripple)
        botaoDownload.addEventListener('click', function(e) {
            let ripple = document.createElement('span');
            ripple.classList.add('ripple');
            
            let rect = e.target.getBoundingClientRect();
            let x = e.clientX - rect.left;
            let y = e.clientY - rect.top;
            
            ripple.style.left = `${x}px`;
            ripple.style.top = `${y}px`;
            
            this.appendChild(ripple);
            
            setTimeout(() => {
                ripple.remove();
            }, 600);
        });
    </script>

    <!-- CSS extra para o efeito de Onda (Ripple) -->
    <style>
        .btn-download span.ripple {
            position: absolute;
            background: rgba(255, 255, 255, 0.4);
            transform: translate(-50%, -50%);
            pointer-events: none;
            border-radius: 50%;
            animation: animacaoRipple 0.6s linear;
            width: 500px;
            height: 500px;
        }

        @keyframes animacaoRipple {
            0% { width: 0; height: 0; opacity: 0.8; }
            100% { width: 500px; height: 500px; opacity: 0; }
        }
    </style>

</body>
</html>
